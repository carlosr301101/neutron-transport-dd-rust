name: CI y Pruebas Funcionales en Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Permite ejecutar manualmente
  workflow_dispatch: 

jobs:
  
  run-ci-tests:
    name: 🧪 CI y Pruebas Unitarias
    uses: ./.github/workflows/rust.yml
    
    # -----------------------------------------------------

  testing-functional:
    name: 🔎 Pruebas Funcionales (Linux)
    runs-on: ubuntu-latest
    
    needs: run-ci-tests
    
    steps:
      - name: ⬇️ Checkout del Código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar Rust (Stable)
        # Usamos 'dtolnay/rust-toolchain' para un manejo más eficiente
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable 

      - name: 🔨 Compilar Binario (Release)
        # Este paso compila y produce el ejecutable optimizado
        run: |
            cargo build --release
      
    