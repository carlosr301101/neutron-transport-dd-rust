[package]
name = "neutron-transport-dd"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["int_64 <carlosr301101@gmail.com>"]
description = "A high-performance neutron transport solver using the S_N (Discrete Ordinates) method with domain decomposition. Solves the 1D neutron transport (Boltzmann) equation with automatic or manual configuration."
license = "MIT"
repository = "https://github.com/carlosr301101/neutron-transport-dd-rust"
documentation = "https://docs.rs/neutron-transport-dd"
keywords = ["neutron", "transport", "boltzmann", "s_n", "domain-decomposition"]
categories = ["science", "simulation", "mathematics"]
readme = "README.md"
include = [
    "src/**",
    "assets/**",
    "data/**",
    "tests/**",
    "doc/PLAN.md",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "TESTS.md",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "neutron_transport_dd"
path = "src/lib.rs"

[[bin]]
name = "nts-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fern = { version = "0.7", default-features = false, features = ["date-based"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
rust_xlsxwriter = "0.104.0"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "point_series", "ab_glyph"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", optional = true, default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }

[dev-dependencies]
calamine = "0.38.0"
tempfile = "3"

[features]
images = ["dep:ratatui-image", "dep:image"]
